<!DOCTYPE html>
<html lang="vi-VN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kỷ Yếu Trái Tim 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #fdf5f6; font-family: 'Microsoft YaHei', 'Songti SC', serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Monoton&family=Abril+Fatface&family=Ma+Shan+Zheng&display=swap');

        :root {
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 105, 180, 0.4);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --accent-gold: #ff1493;
            --text-main: #333333;
            --text-sub: #888888;
            --panel-width: 210px;
            --ui-scale: 0.9; 
        }

        @media screen and (max-width: 768px) { 
            :root { --ui-scale: 0.85; }
            #left-sidebar { width: 90vw !important; left: 5vw !important; top: 70px !important; height: 45vh !important; }
            .bottom-left-panel { width: 90vw !important; left: 5vw !important; bottom: 10px !important; }
            #webcam-wrapper { width: 100px !important; height: 75px !important; top: 15px !important; right: 15px !important; bottom: auto !important; }
            #title-container { top: 5% !important; }
            .title-line { font-size: 30px !important; }
            #top-right-controls { top: 15px !important; right: 15px !important; flex-direction: row !important; } 
            #gesture-hint { font-size: 11px !important; background: rgba(255,255,255,0.8); color: #ff1493 !important; padding: 5px; border-radius: 10px; box-shadow: 0 0 10px rgba(255,105,180,0.2); }
        }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 16px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.15), inset 1px 1px 0px var(--glass-highlight);
            box-sizing: border-box;
        }

        #left-sidebar, .bottom-left-panel { transition: transform 0.4s ease, opacity 0.4s ease; }
        .panel-hidden { transform: translateX(calc(-1 * var(--panel-width) - 50px)) scale(var(--ui-scale)) !important; opacity: 0 !important; pointer-events: none !important; }
        .hidden { display: none !important; }

        #left-sidebar { position: absolute; top: 15px; left: 15px; width: var(--panel-width); height: calc(100vh - 30px); display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; transform: scale(var(--ui-scale)); transform-origin: top left; }
        .scroll-content { flex: 1; overflow-y: auto; pointer-events: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
        .scroll-content::-webkit-scrollbar { display: none; }

        .bottom-left-panel { position: absolute; bottom: 15px; left: 15px; pointer-events: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: var(--panel-width); padding: 10px; box-sizing: border-box; transform: scale(var(--ui-scale)); transform-origin: bottom left; }
        .bottom-left-panel .ui-title-main { grid-column: span 2; font-size: 11px; margin-bottom: 4px; padding-bottom: 2px; }
        .bottom-left-panel .elegant-btn { width: 100%; font-size: 10px; height: 28px; position: relative; }
        .elegant-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .ui-title-main { font-family: 'SimSun', 'Songti SC', serif; font-size: 14px; font-weight: bold; color: #ff1493; text-shadow: 0 0 10px rgba(255, 20, 147, 0.2); border-bottom: 1px solid rgba(255, 105, 180, 0.3); padding-bottom: 4px; margin-bottom: 6px; letter-spacing: 2px; text-align: center; }
        .ui-title-sub { font-size: 12px; color: var(--text-sub); margin-top: 6px; margin-bottom: 3px; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .control-label { color: #555; font-size: 11px; font-weight: 700; }
        .control-row { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }

        .particle-scroll-container { max-height: 140px; overflow-y: auto; padding-right: 4px; margin-right: -4px; border-left: 2px solid rgba(255,105,180,0.2); padding-left: 6px; }
        
        .elegant-btn { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 105, 180, 0.5); color: #ff1493; padding: 5px 0; cursor: pointer; text-transform: uppercase; font-size: 10px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; }
        .elegant-btn:hover { background: rgba(255, 105, 180, 0.15); color: #c71585; border-color: #ff1493; box-shadow: 0 0 10px rgba(255, 105, 180, 0.3); }
        .elegant-btn:active { transform: scale(0.98); }
        .btn-red { border-color: #ff6347; color: #d32f2f; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 3px 0; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 3px; background: rgba(255, 105, 180, 0.2); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { height: 12px; width: 12px; border-radius: 50%; background: #ff1493; -webkit-appearance: none; margin-top: -4.5px; box-shadow: 0 0 5px rgba(255, 20, 147, 0.5); cursor: pointer; }
        .input-glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 105, 180, 0.3); color: #c71585; padding: 3px; font-size: 10px; border-radius: 4px; width: 100%; text-align: center; height: 24px; outline: none; font-weight: bold; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #title-container { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: auto; cursor: move; z-index: 50; padding: 10px; }
        .title-line { margin: 0; white-space: nowrap; color: #ff69b4; text-shadow: 0 0 20px rgba(255, 105, 180, 0.6); }
        
        .top-left-panel { pointer-events: auto; display: flex; flex-direction: column; gap: 4px; padding: 10px; width: 100%; box-sizing: border-box; }
        .interaction-grid { display: flex; gap: 4px; margin-bottom: 4px; }
        
        #top-right-controls { position: absolute; top: 15px; right: 15px; pointer-events: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 50; }
        #webcam-wrapper { position: absolute; bottom: 15px; right: 15px; width: 160px; height: 120px; border: 2px solid #ffb6c1; border-radius: 8px; box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3); overflow: hidden; z-index: 20; background: #fff; transition: 0.4s; pointer-events: auto; }
        #webcam-wrapper.camera-hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
        #webcam-canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
        #cam-status { position: absolute; bottom: 5px; right: 5px; width: 8px; height: 8px; background: #999; border-radius: 50%; box-shadow: 0 0 4px #000; z-index: 30; }
        #cam-status.active { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        
        #delete-manager { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(10px); }
        #photo-grid { display: flex; flex-wrap: wrap; gap: 15px; width: 70%; height: 60%; overflow-y: auto; justify-content: center; padding: 20px; border: 1px solid rgba(255,105,180,0.3); margin: 20px 0; background: rgba(255,240,245,0.8); border-radius: 12px; }
        .photo-item { width: 80px; height: 80px; position: relative; border: 2px solid #ff69b4; cursor: pointer; border-radius: 6px; overflow: hidden; }
        .photo-thumb { width: 100%; height: 100%; object-fit: cover; }
        .delete-x { position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; background: #ff4d4d; color: white; border-radius: 50%; text-align: center; line-height: 22px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .manager-title { color: #ff1493; font-size: 24px; letter-spacing: 2px; font-weight: bold; }
        
        #loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fdf5f6; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .spinner { width: 60px; height: 60px; border: 3px solid rgba(255, 105, 180, 0.2); border-top: 3px solid #ff1493; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader-text { color: #ff1493; font-size: 14px; letter-spacing: 4px; margin-top: 25px; font-weight: bold; }
        
        #gesture-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #ff69b4; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 5; text-shadow: 0 1px 3px rgba(255,255,255,0.8); }
    </style>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", 
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", 
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm" 
            } 
        }
    </script>
</head>
<body>
    <div id="loader"><div class="spinner"></div><div class="loader-text">ĐANG TẢI DỮ LIỆU...</div></div>
    
    <div id="canvas-container"></div>
    
    <div id="title-container">
        <h1 id="display-line1" class="title-line">Sweet</h1>
        <h1 id="display-line2" class="title-line">Memories</h1>
    </div>

    <div id="ui-layer">
        <div id="top-right-controls">
            <button class="elegant-btn glass-panel" id="fs-btn" onclick="toggleFullScreen()" style="padding: 6px 12px;">⛶ Toàn màn hình</button>
            <button class="elegant-btn glass-panel" id="toggle-ui-btn" onclick="toggleUI()" style="padding: 6px 12px;">👁 Ẩn/Hiện UI</button>
        </div>
        <div id="left-sidebar">
            <div class="top-left-panel glass-panel">
                <div class="ui-title-main">TÙY CHỈNH CẢNH</div> 
                <div class="control-row">
                    <input type="text" id="input-line1" class="input-glass" placeholder="Dòng chữ thứ nhất" oninput="updateTextConfig()">
                    <input type="text" id="input-line2" class="input-glass" placeholder="Dòng chữ thứ hai" oninput="updateTextConfig()">
                </div>
                <select id="font-select" class="input-glass" onchange="updateTextConfig()" style="margin-top: 5px;">
                    <option value="style1">Thư pháp</option><option value="style2">Cổ điển</option>
                    <option value="style3">Viết tay</option><option value="style4">Nghệ thuật</option>
                </select>
                <div class="control-row">
                    <div style="display:flex; gap:8px; align-items:center; margin-top: 5px;">
                        <input type="range" min="50" max="250" value="100" id="slider-fontsize" oninput="updateTextConfig()">
                        <input type="color" id="color-picker" value="#ff69b4" oninput="updateTextConfig()" style="width:30px; height:20px; border:none; padding: 0;">
                    </div>
                </div>
                <div class="ui-title-sub" style="border-top:1px solid rgba(255,105,180,0.2); padding-top:6px; margin-top:6px;">Nhạc nền</div>
                <div style="display:flex; gap:8px; margin-bottom:4px;">
                    <button class="elegant-btn" onclick="toggleMusicPlay()" id="play-btn" style="flex:2;">⏯</button>
                    <button class="elegant-btn" onclick="replayMusic()" style="flex:1;">⟲</button>
                </div>
                <input type="range" min="0" max="100" value="50" id="slider-volume" oninput="updateVolume(this.value)">
                
                <div class="ui-title-sub" style="border-top:1px solid rgba(255,105,180,0.2); padding-top:6px; margin-top:6px;">Hiệu ứng hạt</div>
                <div class="particle-scroll-container">
                    <span class="control-label">Mật độ hạt tim</span><input type="range" min="300" max="2000" value="1200" id="slider-tree">
                    <span class="control-label">Bụi hồng phấn</span><input type="range" min="500" max="3000" value="2000" id="slider-dust">
                </div>
                <button class="elegant-btn" style="width:100%; margin-top:8px;" onclick="applyParticleSettings()">⚡ Cập nhật</button>
            </div>
            
            <div class="top-left-panel glass-panel">
                <div class="ui-title-main">TƯƠNG TÁC TAY</div>
                <div class="interaction-grid">
                    <button class="elegant-btn" style="flex:1;" onclick="setMode('TREE')">Gom tim</button>
                    <button class="elegant-btn" style="flex:1;" onclick="setMode('SCATTER')">Phân tán</button>
                </div>
                <button class="elegant-btn" style="width:100%;" onclick="triggerPhotoGrab()">Bắt ảnh / Xem</button>
            </div>
        </div>
        
        <div class="bottom-left-panel glass-panel">
            <div class="ui-title-main">THÊM DỮ LIỆU CỦA BẠN</div>
            <!-- Chấp nhận cả ảnh và video nội bộ -->
            <label class="elegant-btn"> + Thêm Ảnh / Video <input type="file" id="file-input" multiple accept="image/*,video/mp4,video/quicktime"> </label>
            <button class="elegant-btn" onclick="openDeleteManager()">▣ Quản lý Bộ nhớ</button>
            <label class="elegant-btn"> ♫ Tải nhạc nền <input type="file" id="music-input" accept=".mp3,audio/mpeg"> </label>
            <button class="elegant-btn btn-red" id="toggle-cam-btn" onclick="toggleCameraDisplay()" style="margin-top: 5px;">📸 Bật/Tắt AI Camera</button>
        </div>
    </div>
    
    <div id="gesture-hint">Vuốt chạm để xoay | Chạm để Xem ảnh/Phát Video | Cử chỉ: Nắm tay (Gom), Mở tay (Phân tán), Đẩy (Video/Tiếp)</div>
    
    <div id="webcam-wrapper">
        <canvas id="webcam-canvas" width="320" height="240"></canvas>
        <div id="cam-status"></div>
    </div>
    <video id="webcam-video" autoplay playsinline muted style="display:none"></video>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // Đổi tên DB để reset database chứa File/Blob thực tế
        const DB_NAME = "HeartTreeDB_v1"; 

        let CONFIG = {
            colors: { 
                bg: 0xfdf5f6, // Trắng hồng
                pinkHot: 0xff69b4, 
                pinkLight: 0xffb6c1, 
                pinkDeep: 0xff1493,
                whiteGlow: 0xffffff
            },
            particles: { count: window.innerWidth < 768 ? 600 : 1200, dustCount: window.innerWidth < 768 ? 1000 : 2000 },
            camera: { z: 55 },
            interaction: { rotationSpeed: 1.4 }
        };

        const STATE = { 
            mode: 'TREE', 
            focusTarget: null, 
            focusIndex: -1,
            hand: { detected: false, x: 0, y: 0 }, 
            rotation: { x: 0, y: 0 }, 
            uiVisible: true, 
            cameraVisible: true
        };

        let aiEnabled = true;

        const FONT_STYLES = { 
            'style1': { font: "'Ma Shan Zheng', cursive", spacing: "4px", shadow: "2px 2px 8px rgba(255,105,180,0.5)" }, 
            'style2': { font: "'Cinzel', serif", spacing: "6px", shadow: "0 0 20px rgba(255,105,180,0.3)" }, 
            'style3': { font: "'Great Vibes', cursive", spacing: "1px", shadow: "0 0 15px rgba(255,20,147,0.5)" }, 
            'style4': { font: "'Monoton', cursive", spacing: "1px", shadow: "0 0 10px #ff69b4" }
        };

        let db, scene, camera, renderer, composer, mainGroup;
        let particleSystem = [], photoMeshes = [], photoMeshGroup = new THREE.Group();
        let dustSystem = [];
        let clock = new THREE.Clock();
        let handLandmarker, videoElement;
        let bgmAudio = new Audio(); bgmAudio.loop = true; let isMusicPlaying = false;
        
        // Quản lý video local đang phát
        let activeVideoEl = null; 

        window.toggleUI = () => { 
            STATE.uiVisible = !STATE.uiVisible; 
            document.getElementById('left-sidebar').classList.toggle('panel-hidden', !STATE.uiVisible); 
            document.querySelector('.bottom-left-panel').classList.toggle('panel-hidden', !STATE.uiVisible); 
        };

        window.toggleCameraDisplay = () => { 
            STATE.cameraVisible = !STATE.cameraVisible; 
            document.getElementById('webcam-wrapper').classList.toggle('camera-hidden', !STATE.cameraVisible);
            aiEnabled = STATE.cameraVisible;
            if(!aiEnabled && videoElement) videoElement.pause();
            if(aiEnabled && videoElement) videoElement.play();
        };
        
        window.toggleFullScreen = () => { if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
        window.toggleMusicPlay = () => { if(!bgmAudio.src) return alert("Vui lòng tải nhạc lên trước"); if(isMusicPlaying){ bgmAudio.pause(); isMusicPlaying=false; } else { bgmAudio.play(); isMusicPlaying=true; } document.getElementById('play-btn').innerText = isMusicPlaying ? "⏸" : "⏯"; };
        window.replayMusic = () => { if(!bgmAudio.src) return; bgmAudio.currentTime=0; bgmAudio.play(); isMusicPlaying=true; document.getElementById('play-btn').innerText="⏸"; };
        window.updateVolume = (v) => { bgmAudio.volume = v/100; };
        
        window.setMode = (mode) => { 
            STATE.mode = mode; 
            STATE.focusTarget = null; 
            if(activeVideoEl) { activeVideoEl.pause(); activeVideoEl = null; }
        };

        window.triggerPhotoGrab = () => { 
            if(photoMeshes.length === 0) return;
            if(STATE.focusIndex === -1) STATE.focusIndex = 0;
            setMode('FOCUS');
            STATE.focusTarget = photoMeshes[STATE.focusIndex].mesh;
        };

        function focusNextPhoto() {
            if(photoMeshes.length === 0) return;
            if(activeVideoEl) { activeVideoEl.pause(); activeVideoEl = null; }
            STATE.focusIndex = (STATE.focusIndex + 1) % photoMeshes.length;
            STATE.focusTarget = photoMeshes[STATE.focusIndex].mesh;
        }

        function focusPrevPhoto() {
            if(photoMeshes.length === 0) return;
            if(activeVideoEl) { activeVideoEl.pause(); activeVideoEl = null; }
            STATE.focusIndex = (STATE.focusIndex - 1 + photoMeshes.length) % photoMeshes.length;
            STATE.focusTarget = photoMeshes[STATE.focusIndex].mesh;
        }

        function loadTextConfig() { 
            const s = JSON.parse(localStorage.getItem('v18_text_config')); 
            if(s){ document.getElementById('input-line1').value=s.line1; document.getElementById('input-line2').value=s.line2; document.getElementById('font-select').value=s.fontKey; document.getElementById('slider-fontsize').value=s.size; document.getElementById('color-picker').value=s.color; applyTextConfig(s.fontKey,s.line1,s.line2,s.size,s.color); } 
            else applyTextConfig("style3","Sweet","Memories",120,"#ff1493"); 
        }
        window.updateTextConfig = () => { const k=document.getElementById('font-select').value, l1=document.getElementById('input-line1').value, l2=document.getElementById('input-line2').value, s=document.getElementById('slider-fontsize').value, c=document.getElementById('color-picker').value; localStorage.setItem('v18_text_config',JSON.stringify({fontKey:k,line1:l1,line2:l2,size:s,color:c})); applyTextConfig(k,l1,l2,s,c); };
        function applyTextConfig(k,l1,l2,s,c) { const st=FONT_STYLES[k]||FONT_STYLES['style1']; const t1=document.getElementById('display-line1'), t2=document.getElementById('display-line2'), ct=document.getElementById('title-container'); ct.style.fontFamily=st.font; t1.innerText=l1; t2.innerText=l2; t1.style.letterSpacing=st.spacing; t2.style.letterSpacing=st.spacing; t1.style.textShadow=st.shadow; t2.style.textShadow=st.shadow; t1.style.color=c; t2.style.color=c; t1.style.fontSize=(0.48*s)+"px"; t2.style.fontSize=(0.48*s)+"px"; }

        // --- KHỞI TẠO HỆ THỐNG ---
        function init() {
            if (window.innerWidth <= 768) {
                window.toggleUI(); 
                window.toggleCameraDisplay(); 
            }

            initThree(); setupEnvironment(); setupLights(); createParticles(); createDust(); 
            setupPostProcessing(); setupEvents(); animate();
            
            setTimeout(() => { document.getElementById('loader').style.opacity = 0; setTimeout(()=>document.getElementById('loader').remove(), 500); }, 1500);
            
            loadTextConfig();
            initDB().then(async () => {
                const medias = await loadMediaFromDB();
                if(medias?.length > 0) {
                    medias.forEach(m => {
                        const url = URL.createObjectURL(m.blob);
                        createMediaTexture(url, m.id, m.isVideo, m.msg);
                    });
                }
            });

            initMediaPipe(); initDraggableTitle(); setupTouchControls();
        }

        function initThree() { 
            scene=new THREE.Scene(); scene.background=new THREE.Color(CONFIG.colors.bg); scene.fog=new THREE.FogExp2(CONFIG.colors.bg,0.015); 
            camera=new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,0.1,1000); camera.position.set(0,2,CONFIG.camera.z); 
            renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"}); renderer.setSize(window.innerWidth,window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2)); renderer.toneMapping=THREE.ReinhardToneMapping; renderer.toneMappingExposure=2.2; 
            document.getElementById('canvas-container').appendChild(renderer.domElement); 
            mainGroup=new THREE.Group(); scene.add(mainGroup); 
        }
        function setupEnvironment() { const p=new THREE.PMREMGenerator(renderer); scene.environment=p.fromScene(new RoomEnvironment(),0.04).texture; }
        function setupLights() { 
            scene.add(new THREE.AmbientLight(0xffffff, 0.8)); 
            const pointLight = new THREE.PointLight(0xff69b4, 2, 30); pointLight.position.set(0, 5, 0); mainGroup.add(pointLight); 
            const spotLight1 = new THREE.SpotLight(0xffb6c1, 1000); spotLight1.position.set(30, 40, 40); spotLight1.angle=0.5; spotLight1.penumbra=0.5; scene.add(spotLight1); 
            const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(0, 0, 50); scene.add(dirLight); 
        }
        function setupPostProcessing() { 
            composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera)); 
            // Bloom threshold cao để nền trắng không bị lóa, chỉ hạt hồng phát sáng
            const b=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight), 1.2, 0.6, 0.85); 
            b.threshold=0.8; b.strength=0.7; b.radius=0.6; composer.addPass(b); 
        }

        // --- DATABASE LOCAL FILES ---
        function initDB() { 
            return new Promise(r=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:"id"});if(!d.objectStoreNames.contains('music'))d.createObjectStore('music',{keyPath:"id"})};q.onsuccess=e=>{db=e.target.result;r(db)};q.onerror=()=>r(null)});
        }
        function saveMediaToDB(blob, isVideo, msg) {
            if(!db) return null;
            return new Promise(r => {
                const id = Date.now().toString() + Math.random().toString(36).substring(2,7);
                const tx = db.transaction('media',"readwrite");
                tx.objectStore('media').add({id, blob, isVideo, msg});
                tx.oncomplete = () => r(id);
            });
        }
        function loadMediaFromDB() {
            if(!db) return Promise.resolve([]); 
            return new Promise(r=>{db.transaction('media',"readonly").objectStore('media').getAll().onsuccess=e=>r(e.target.result)});
        }
        function deleteMediaFromDB(id){if(db)db.transaction('media',"readwrite").objectStore('media').delete(id);}
        function clearMediaDB(){if(db)db.transaction('media',"readwrite").objectStore('media').clear();}
        
        function saveMusicToDB(b){if(!db)return;db.transaction('music',"readwrite").objectStore('music').put({id:'bgm',blob:b});}
        function loadMusicFromDB(){if(!db)return Promise.resolve(null);return new Promise(r=>{db.transaction('music',"readonly").objectStore('music').get('bgm').onsuccess=e=>r(e.target.result?e.target.result.blob:null)});}

        // --- MÔ HÌNH TOÁN HỌC TRÁI TIM 3D ---
        class Particle {
            constructor(m,t){this.mesh=m;this.type=t;this.posTree=new THREE.Vector3();this.posScatter=new THREE.Vector3();this.baseScale=m.scale.x;this.isVideo=false;this.videoEl=null;const s=(t==='PHOTO')?0.3:2.0;this.spinSpeed=new THREE.Vector3((Math.random()-0.5)*s,(Math.random()-0.5)*s,(Math.random()-0.5)*s);this.calcPos();}
            calcPos(){
                // Trái tim 3D (Thể tích)
                let u = Math.random() * Math.PI * 2;
                let v = Math.random() * Math.PI * 2;
                let rDist = Math.cbrt(Math.random()); 
                
                let x = 16 * Math.pow(Math.sin(u), 3);
                let y = 13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u);
                let z = 5 * Math.sin(v); // Độ dày
                z *= (1 - Math.abs(x)/16); // Vát viền mỏng đi
                
                let scale = 0.55; 
                this.posTree.set(x * scale * rDist, (y * scale * rDist) + 5, z * scale * rDist);
                
                // Phân tán (Cầu rỗng)
                let rs = 10 + Math.random()*15;
                const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
                this.posScatter.set(rs*Math.sin(ph)*Math.cos(th), rs*Math.sin(ph)*Math.sin(th), rs*Math.cos(ph));
            }
            update(dt,mode,ft){
                let tg = this.posTree; 
                if(mode==='SCATTER') tg = this.posScatter; 
                else if(mode==='FOCUS'){
                    if(this.mesh===ft){
                        let off = new THREE.Vector3(0,0,32);
                        const im = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        tg = off.applyMatrix4(im);
                    }else tg = this.posScatter;
                }
                
                this.mesh.position.lerp(tg,((mode==='FOCUS'&&this.mesh===ft)?8.0:4.0)*dt);
                
                if(mode==='SCATTER'){
                    this.mesh.rotation.x += this.spinSpeed.x*dt; this.mesh.rotation.y += this.spinSpeed.y*dt; this.mesh.rotation.z += this.spinSpeed.z*dt;
                } else if(mode==='TREE'){
                    this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x,0,dt); this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z,0,dt);
                    this.mesh.rotation.y += 0.5*dt;
                }
                
                if(mode==='FOCUS' && this.mesh===ft) this.mesh.lookAt(camera.position); 
                
                let s = this.baseScale;
                if(mode==='SCATTER' && this.type==='PHOTO') s = this.baseScale*2.5;
                else if(mode==='FOCUS'){ if(this.mesh===ft) s=3.8; else s=this.baseScale*0.8; }
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s),6*dt);
            }
        }

        function createParticles() {
            const sg=new THREE.SphereGeometry(0.4, 16, 16); 
            const bg=new THREE.BoxGeometry(0.5,0.5,0.5); 
            
            // Chất liệu hồng Glow cực xịn
            const mHot = new THREE.MeshStandardMaterial({color: CONFIG.colors.pinkHot, emissive: CONFIG.colors.pinkDeep, emissiveIntensity: 1.5, metalness: 0.2}); 
            const mLight = new THREE.MeshStandardMaterial({color: CONFIG.colors.whiteGlow, emissive: CONFIG.colors.pinkLight, emissiveIntensity: 1.2, metalness: 0.1}); 
            const mDeep = new THREE.MeshPhysicalMaterial({color: CONFIG.colors.pinkDeep, emissive: 0x880044, emissiveIntensity: 1, clearcoat: 1}); 

            for(let i=0; i<CONFIG.particles.count; i++){
                const r=Math.random(); let m,t;
                if(r<0.3){ m=new THREE.Mesh(bg, mLight); t='BOX'; }
                else if(r<0.7){ m=new THREE.Mesh(sg, mHot); t='SPHERE_HOT'; }
                else { m=new THREE.Mesh(sg, mDeep); t='SPHERE_DEEP'; }
                
                const s = 0.4 + Math.random()*0.6; m.scale.setScalar(s);
                m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
                mainGroup.add(m); particleSystem.push(new Particle(m,t));
            }
            mainGroup.add(photoMeshGroup);
        }

        function createDust(){
            const g = new THREE.TetrahedronGeometry(0.08,0);
            const m = new THREE.MeshBasicMaterial({color: 0xffb6c1, transparent:true, opacity:0.6});
            for(let i=0; i<CONFIG.particles.dustCount; i++){
                const ms = new THREE.Mesh(g,m);
                ms.scale.setScalar(0.5+Math.random());
                const p = new Particle(ms,'DUST');
                p.isDust = true;
                dustSystem.push(p);
                mainGroup.add(ms);
            }
        }
        
        // --- TEXT CARD (LỜI CHÚC) ---
        function createTextCard(msg) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.roundRect(0, 0, 1024, 256, 30); ctx.fill();
            ctx.strokeStyle = '#ff69b4'; ctx.lineWidth = 10; ctx.stroke();

            ctx.fillStyle = '#ff1493';
            ctx.font = 'bold 50px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(msg, 512, 128);

            const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
            const geo = new THREE.PlaneGeometry(1.6, 0.4);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
            return new THREE.Mesh(geo, mat);
        }

        function createMediaTexture(url, id, isVideo, msg) {
            if (isVideo) {
                const video = document.createElement('video');
                video.src = url; video.crossOrigin = 'anonymous';
                video.loop = true; video.muted = false; video.playsInline = true;
                video.load();
                
                const tex = new THREE.VideoTexture(video); tex.colorSpace = THREE.SRGBColorSpace;
                // Gọi sự kiện load data để lấy tỷ lệ khung hình
                video.onloadedmetadata = () => { addMediaToScene(tex, id, video.videoWidth/video.videoHeight, true, msg, video); };
            } else {
                const img = new Image(); img.src = url;
                img.onload = () => {
                    const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;
                    addMediaToScene(tex, id, img.width/img.height, false, msg, null);
                };
            }
        }

        function addMediaToScene(tex, id, aspect, isVideo, msg, videoEl){
            let w=1.6, h=1.6; if(aspect>1) h=w/aspect; else w=h*aspect;
            
            const frameGeo = new THREE.BoxGeometry(w+0.1, h+0.1, 0.05); 
            const frameMat = new THREE.MeshStandardMaterial({color: 0xffb6c1, metalness: 0.3, roughness: 0.2}); 
            const frameMesh = new THREE.Mesh(frameGeo, frameMat); 
            
            const planeGeo = new THREE.PlaneGeometry(w, h); 
            const planeMat = new THREE.MeshBasicMaterial({map: tex}); 
            const planeMesh = new THREE.Mesh(planeGeo, planeMat); planeMesh.position.z=0.03; 
            
            const g = new THREE.Group(); g.add(frameMesh); g.add(planeMesh); 
            
            // Chèn lời chúc nếu có
            if (msg && msg.trim() !== "") {
                const txtMesh = createTextCard(msg);
                txtMesh.position.y = -(h/2 + 0.3); txtMesh.position.z = 0.02;
                g.add(txtMesh);
            }
            
            g.scale.setScalar(0.7); photoMeshGroup.add(g); 
            const pt = new Particle(g,'PHOTO'); 
            pt.mediaId = id; pt.isVideo = isVideo; pt.videoEl = videoEl;
            particleSystem.push(pt); photoMeshes.push(pt);
        }

        window.applyParticleSettings=()=>{
            const ph = particleSystem.filter(p=>p.type==='PHOTO'); const tr=[];
            mainGroup.children.forEach(c=>{if(c!==photoMeshGroup)tr.push(c)}); tr.forEach(c=>mainGroup.remove(c));
            particleSystem=[...ph]; dustSystem=[];
            CONFIG.particles.count=parseInt(document.getElementById('slider-tree').value);
            CONFIG.particles.dustCount=parseInt(document.getElementById('slider-dust').value);
            createParticles(); createDust(); 
        };

        // --- TƯƠNG TÁC VUỐT / CHẠM (MOBILE + DESKTOP) ---
        function setupTouchControls() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isDragging = false, startMouse = {x:0}, prevMouse = {x:0, y:0};

            renderer.domElement.addEventListener('pointerdown', (e) => {
                isDragging = true; startMouse.x = e.clientX; prevMouse = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('pointermove', (e) => {
                if(isDragging && STATE.mode !== 'FOCUS') {
                    const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
                    STATE.rotation.y += dx * 0.005; STATE.rotation.x += dy * 0.005;
                    prevMouse = { x: e.clientX, y: e.clientY };
                }
            });

            renderer.domElement.addEventListener('pointerup', (e) => {
                isDragging = false;
                const diffX = e.clientX - startMouse.x;
                
                if (Math.abs(diffX) > 50 && STATE.mode === 'FOCUS') {
                    if (diffX < 0) focusNextPhoto(); else focusPrevPhoto();
                    return;
                }

                if (Math.abs(diffX) < 10) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const pMeshes = photoMeshes.map(p => p.mesh);
                    const intersects = raycaster.intersectObjects(pMeshes, true);

                    if(intersects.length > 0) {
                        let obj = intersects[0].object; while(obj.parent && obj.parent.type === 'Group') obj = obj.parent;
                        
                        if(STATE.mode !== 'FOCUS' || STATE.focusTarget !== obj) {
                            STATE.focusIndex = photoMeshes.findIndex(p => p.mesh === obj);
                            setMode('FOCUS'); STATE.focusTarget = obj;
                        } else {
                            // Tap lần 2 để Play/Pause Video
                            const pData = photoMeshes.find(p => p.mesh === obj);
                            if(pData && pData.isVideo && pData.videoEl) {
                                if(pData.videoEl.paused) { pData.videoEl.play(); activeVideoEl = pData.videoEl; }
                                else { pData.videoEl.pause(); activeVideoEl = null; }
                            }
                        }
                    } else if (STATE.mode === 'FOCUS') setMode('TREE');
                }
            });
        }

        // --- AI CAMERA (CHỐNG LỖI CỬ CHỈ) ---
        async function initMediaPipe(){
            videoElement = document.getElementById('webcam-video');
            if(navigator.mediaDevices?.getUserMedia){
                try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); videoElement.srcObject=s; videoElement.onloadedmetadata=()=>{videoElement.play();renderWebcamPreview()}; }catch(e){console.error(e)}
            }
            try{ const v=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"); handLandmarker=await HandLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:`https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,delegate:"GPU"},runningMode:"VIDEO",numHands:1}); predictWebcam(); }catch(e){console.warn(e)}
        }
        function renderWebcamPreview(){const c=document.getElementById('webcam-canvas'),x=c.getContext('2d',{willReadFrequently:true});function d(){if(videoElement.readyState>=2)x.drawImage(videoElement,0,0,c.width,c.height);requestAnimationFrame(d)}d()}
        
        let lastVideoTime = -1, lastActionTime = 0;
        async function predictWebcam(){
            if(aiEnabled && videoElement && videoElement.currentTime!==lastVideoTime && handLandmarker){
                lastVideoTime=videoElement.currentTime; const r=handLandmarker.detectForVideo(videoElement,performance.now()); processGestures(r); document.getElementById('cam-status').classList.toggle('active',r.landmarks.length>0);
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(r){
            if(r.landmarks && r.landmarks.length>0){
                STATE.hand.detected=true; const lm=r.landmarks[0]; 
                STATE.hand.x=(lm[9].x-0.5)*2; STATE.hand.y=(lm[9].y-0.5)*2;
                
                const wrist=lm[0], thumb=lm[4], index=lm[8], middleBase=lm[9], middleTip=lm[12];
                const pinchDist = Math.hypot(thumb.x-index.x, thumb.y-index.y); 
                const openDist = Math.hypot(middleTip.x-wrist.x, middleTip.y-wrist.y);
                const handBoxSize = Math.hypot(middleBase.x-wrist.x, middleBase.y-wrist.y);
                
                const isFist = openDist < 0.15;
                const isPinch = pinchDist < 0.05 && openDist > 0.15;
                const isOpen = openDist > 0.25 && handBoxSize <= 0.2;
                const isPush = openDist > 0.25 && handBoxSize > 0.25; 
                
                const now = performance.now();
                const canAct = (now - lastActionTime > 1000);

                if (isFist) {
                    if (STATE.mode === 'FOCUS') { setMode('TREE'); lastActionTime = now; }
                } else if (isPush) {
                    if (STATE.mode === 'FOCUS' && canAct) {
                        const pData = photoMeshes.find(p => p.mesh === STATE.focusTarget);
                        if (pData && pData.isVideo) { if(pData.videoEl.paused) {pData.videoEl.play(); activeVideoEl = pData.videoEl;} else {pData.videoEl.pause(); activeVideoEl = null;} } 
                        else focusNextPhoto();
                        lastActionTime = now;
                    }
                } else if (isPinch) {
                    if (STATE.mode !== 'FOCUS' && canAct) { triggerPhotoGrab(); lastActionTime = now; }
                } else if (isOpen) {
                    if (STATE.mode === 'FOCUS') {
                       if (STATE.hand.x > 0.6 && canAct) { focusPrevPhoto(); lastActionTime = now; }
                       if (STATE.hand.x < -0.6 && canAct) { focusNextPhoto(); lastActionTime = now; }
                    } else {
                       setMode('SCATTER');
                       const th=0.3, s=CONFIG.interaction.rotationSpeed;
                       if(STATE.hand.x>th) STATE.rotation.y -= s*0.016*(STATE.hand.x-th);
                       else if(STATE.hand.x<-th) STATE.rotation.y -= s*0.016*(STATE.hand.x+th);
                    }
                }
            } else STATE.hand.detected=false;
        }

        window.setupEvents=()=>{
            window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);composer.setSize(window.innerWidth,window.innerHeight)});
            document.getElementById('music-input').addEventListener('change', async e=>{
                const f=e.target.files[0]; if(f){ saveMusicToDB(f); bgmAudio.src=URL.createObjectURL(f); bgmAudio.play().then(()=>{isMusicPlaying=true; document.getElementById('play-btn').innerText="⏸"}).catch(console.error)}
            });
            document.getElementById('file-input').addEventListener('change', async e => {
                for(let f of e.target.files) {
                    let isVid = f.type.startsWith('video/');
                    let msg = prompt("Nhập lời chúc đính kèm ảnh/video này (để trống nếu không muốn):", "");
                    let id = await saveMediaToDB(f, isVid, msg);
                    let url = URL.createObjectURL(f);
                    createMediaTexture(url, id, isVid, msg);
                }
            });
        }

        window.openDeleteManager=async()=>{
            document.getElementById('delete-manager').classList.remove('hidden'); const g=document.getElementById('photo-grid'); g.innerHTML='';
            const ps=await loadMediaFromDB();
            if(!ps||ps.length===0) g.innerHTML='<div style="color:#888;">Chưa có dữ liệu</div>';
            else ps.forEach(p=>{
                const d=document.createElement('div'); d.className='photo-item';
                let tag;
                if(p.isVideo) { tag = document.createElement('video'); tag.src = URL.createObjectURL(p.blob); tag.muted=true; tag.autoplay=true; tag.loop=true; }
                else { tag = document.createElement('img'); tag.src = URL.createObjectURL(p.blob); }
                tag.className='photo-thumb';
                const b=document.createElement('div'); b.className='delete-x'; b.innerText='X';
                b.onclick=e=>{e.stopPropagation();confirmDelete(p.id,d)};
                d.appendChild(tag); d.appendChild(b); g.appendChild(d);
            });
        }
        window.confirmDelete=(id,el)=>{deleteMediaFromDB(id);el.remove();const p=particleSystem.find(pa=>pa.mediaId===id);if(p){photoMeshGroup.remove(p.mesh);particleSystem.splice(particleSystem.indexOf(p),1);photoMeshes.splice(photoMeshes.indexOf(p),1)}}
        window.clearAllPhotos=()=>{if(confirm("Xóa toàn bộ nội dung?")){clearMediaDB();photoMeshes.forEach(p=>photoMeshGroup.remove(p.mesh));particleSystem=particleSystem.filter(p=>p.type!=='PHOTO');photoMeshes=[];window.openDeleteManager()}}
        window.closeDeleteManager=()=>{document.getElementById('delete-manager').classList.add('hidden')}

        function animate() {
            requestAnimationFrame(animate); const dt=clock.getDelta(); const et=clock.getElapsedTime();
            
            // Chuyển động bụi
            dustSystem.forEach(p => {
                p.mesh.position.y += Math.sin(et + p.mesh.id) * 0.5 * dt;
                p.mesh.position.x += Math.cos(et + p.mesh.id) * 0.5 * dt;
                p.mesh.scale.setScalar(0.5 + 0.3*Math.sin(et*2 + p.mesh.id));
            });

            if(STATE.mode==='TREE'){STATE.rotation.y+=0.3*dt;STATE.rotation.x+=(0-STATE.rotation.x)*2.0*dt;}
            else if (STATE.mode !== 'FOCUS') {STATE.rotation.y+=0.1*dt;}
            
            mainGroup.rotation.y=STATE.rotation.y; mainGroup.rotation.x=STATE.rotation.x;
            particleSystem.forEach(p=>p.update(dt,STATE.mode,STATE.focusTarget));
            composer.render();
        }
        init();
    </script>
